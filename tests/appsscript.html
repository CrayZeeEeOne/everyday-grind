// Підроблені сервіси Google: перевіряють логіку скрипта, але НЕ обчислюють формули таблиці.
const book = {}; const formulas = {};
const col = (L) => L.charCodeAt(0) - 64;
function makeSheet(name) {
  const rows = [];
  const range = (r, c, h = 1, w = 1) => {
    const api = {
      setValues(v) { v.forEach((line, i) => line.forEach((x, j) => { (rows[r - 1 + i] ||= [])[c - 1 + j] = x; })); return api; },
      setFormula(f) { formulas[`${name}!${r},${c}`] = f; (rows[r - 1] ||= [])[c - 1] = ''; return api; },
      setFontWeight: () => api, setNumberFormat: () => api, clearContent: () => api,
    };
    return api;
  };
  return {
    rows,
    getRange(a, b, c, d) {
      if (typeof a !== 'string') return range(a, b, c, d);
      const m = a.match(/^([A-Z])(\d+)/);
      return m ? range(+m[2], col(m[1])) : range(1, 1, 0, 0);
    },
    setFrozenRows() {}, getLastRow: () => rows.length, getMaxRows: () => 1000, insertRowsAfter() {},
    appendRow(v) { rows.push(v.slice()); }, deleteRow(n) { rows.splice(n - 1, 1); },
    getDataRange: () => ({ getValues() { const w = Math.max(...rows.map((r) => r.length)); return rows.map((r) => Array.from({ length: w }, (_, i) => r[i] ?? '')); } }),
  };
}
const ss = { setSpreadsheetLocale() {}, setSpreadsheetTimeZone() {}, getSheetByName: (n) => book[n] || null, insertSheet: (n) => (book[n] = makeSheet(n)) };

const SpreadsheetApp = { getActive: () => ss, flush: fakeScores };
const chain = new Proxy({}, { get: (_, k) => (k === 'create' ? () => triggers++ : () => chain) });
const ScriptApp = { getProjectTriggers: () => [], newTrigger: () => chain };
const LockService = { getScriptLock: () => ({ waitLock() {}, releaseLock() {} }) };
const Utilities = { formatDate: () => NOW };
const ContentService = { MimeType: {}, createTextOutput: (t) => ({ setMimeType: () => JSON.parse(t) }) };
</script>
